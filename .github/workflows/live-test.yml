# Real login / connect / Meshnet against NordVPN. Never runs on pull requests:
# the token lives in the protected `live` Environment, reachable from main only.
name: live-test

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-test
  cancel-in-progress: false

jobs:
  live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: live
    strategy:
      max-parallel: 1
      matrix:
        protocol: [nordlynx, openvpn_udp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: nordmesh:live
          cache-from: type=gha,scope=linux/amd64
      - name: Live test
        env:
          NORDVPN_TOKEN: ${{ secrets.NORDVPN_TOKEN }}
          PEER: ${{ vars.LIVE_TEST_PEER }}
          PROTOCOL: ${{ matrix.protocol }}
        run: scripts/live-test.sh nordmesh:live
