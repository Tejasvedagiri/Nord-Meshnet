# Token from a Docker secret instead of an environment variable.
#   printf '%s' "your-token" > nordvpn_token.txt && chmod 600 nordvpn_token.txt
services:
  nordmesh:
    image: ghcr.io/tejasvedagiri/nordmesh:1
    container_name: nordmesh
    hostname: nordmesh-node
    cap_add: [NET_ADMIN, NET_RAW]
    devices: [/dev/net/tun:/dev/net/tun]
    security_opt: [no-new-privileges:true]
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv4.conf.all.arp_ignore=1
      - net.ipv4.conf.all.rp_filter=2
    volumes:
      - ./nordvpn:/var/lib/nordvpn
    secrets: [nordvpn_token]
    environment:
      - NORDVPN_TOKEN_FILE=/run/secrets/nordvpn_token
      - NORDVPN_MESHNET=on
      - NORDVPN_NICKNAME=mesh-only
    restart: unless-stopped

secrets:
  nordvpn_token:
    file: ./nordvpn_token.txt
